<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PULSE // Apex Tri-Platform Command Center</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            void: '#030508',
            panel: 'rgba(10, 14, 23, 0.7)',
            cyber: {
              cyan: '#00f2fe',
              neon: '#38bdf8',
              violet: '#8b5cf6',
              amber: '#ffa116',
              emerald: '#10b981',
              rose: '#f43f5e'
            }
          },
          fontFamily: {
            mono: ['JetBrains Mono', 'Fira Code', 'monospace'],
            sans: ['Inter', 'system-ui', 'sans-serif']
          },
          boxShadow: {
            'glow-cyan': '0 0 30px -5px rgba(0, 242, 254, 0.35)',
            'glow-violet': '0 0 30px -5px rgba(139, 92, 246, 0.35)',
            'glow-amber': '0 0 30px -5px rgba(255, 161, 22, 0.35)',
            'inner-glow': 'inset 0 1px 1px 0 rgba(255, 255, 255, 0.1)'
          },
          animation: {
            'scanline': 'scan 8s linear infinite',
            'float': 'float 5s ease-in-out infinite',
            'pulse-glow': 'pulseGlow 3s ease-in-out infinite'
          },
          keyframes: {
            scan: {
              '0%': { transform: 'translateY(-100%)' },
              '100%': { transform: 'translateY(1000%)' }
            },
            float: {
              '0%, 100%': { transform: 'translateY(0px)' },
              '50%': { transform: 'translateY(-6px)' }
            },
            pulseGlow: {
              '0%, 100%': { opacity: '0.4' },
              '50%': { opacity: '0.8' }
            }
          }
        }
      }
    };
  </script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

  <!-- React 18 & Babel Standalone -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      background-color: #030508;
      color: #e2e8f0;
      overflow-x: hidden;
      font-feature-settings: "cv02", "cv03", "cv04", "cv11";
    }

    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: #05070d; }
    ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: #00f2fe; }

    .cyber-panel {
      background: rgba(8, 12, 20, 0.65);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.07);
      position: relative;
    }
    .cyber-panel:hover {
      border-color: rgba(0, 242, 254, 0.25);
    }

    .cyber-gradient {
      background: linear-gradient(135deg, #00f2fe 0%, #8b5cf6 50%, #ffa116 100%);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .grid-lines {
      background-size: 40px 40px;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
    }
  </style>
</head>
<body class="selection:bg-cyan-500/20 selection:text-cyan-300">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // DEFAULT SQUAD CONFIGURATION
    const DEFAULT_MEMBERS = [
      { name: 'Arjun', cf: 'Arjun_7015', lc: 'Arjun_7015', cc: 'arjun_7015' },
      { name: 'Kalpy', cf: 'kalpy', lc: 'kalpy', cc: 'kalpy' },
      { name: 'Bhavishya', cf: 'bhavishya4208', lc: 'bhavishya4208', cc: 'bhavishya4208' },
      { name: 'Pritish', cf: 'pritishbaid', lc: 'pritishbaid', cc: 'pritishbaid' },
      { name: 'Pulkit', cf: 'PulkitDaddy', lc: 'PulkitDaddy', cc: 'pulkitdaddy' },
      { name: 'Sahil', cf: 'sahildewy19', lc: 'sahildewy19', cc: 'sahildewy19' }
    ];

    const CACHE_KEY_MEMBERS = 'PULSE_MEMBERS_V5';
    const CACHE_KEY_DATA = 'PULSE_DATA_V6';
    const CACHE_EXPIRY = 5 * 60 * 1000; // 5 min

    // CODEFORCES TIERS
    const CF_RANKS = [
      { min: 0, max: 1199, name: 'Newbie', color: '#808080' },
      { min: 1200, max: 1399, name: 'Pupil', color: '#008000' },
      { min: 1400, max: 1599, name: 'Specialist', color: '#03a89e' },
      { min: 1600, max: 1899, name: 'Expert', color: '#3b82f6' },
      { min: 1900, max: 2199, name: 'Candidate Master', color: '#a855f7' },
      { min: 2200, max: 2299, name: 'Master', color: '#f59e0b' },
      { min: 2300, max: 2399, name: 'International Master', color: '#ea580c' },
      { min: 2400, max: 2999, name: 'Grandmaster', color: '#ef4444' },
      { min: 3000, max: 9999, name: 'Legendary GM', color: '#ff0033' }
    ];

    function getRankMeta(rating) {
      if (!rating || rating <= 0) return { name: 'Unrated', color: '#94a3b8' };
      return CF_RANKS.find(r => rating >= r.min && rating <= r.max) || CF_RANKS[0];
    }

    function formatTimeAgo(ts) {
      const sec = Math.floor((Date.now() - ts * 1000) / 1000);
      if (sec < 60) return `${sec}s ago`;
      const min = Math.floor(sec / 60);
      if (min < 60) return `${min}m ago`;
      const hr = Math.floor(min / 60);
      if (hr < 24) return `${hr}h ago`;
      return `${Math.floor(hr / 24)}d ago`;
    }

    // ==========================================
    // INTERACTIVE CYBERNETIC CANVAS
    // ==========================================
    // Use the browser's local calendar date consistently for activity stats.
    function localDateKey(date) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const day = String(date.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    function dateKeyOrdinal(dateKey) {
      const [year, month, day] = dateKey.split('-').map(Number);
      return Date.UTC(year, month - 1, day) / 86400000;
    }

    // Space Codeforces API requests to avoid sending them too quickly.
    let lastCodeforcesRequestAt = 0;
    async function fetchCodeforcesJson(url) {
      const wait = Math.max(0, 2100 - (Date.now() - lastCodeforcesRequestAt));
      if (wait) await new Promise(resolve => setTimeout(resolve, wait));
      lastCodeforcesRequestAt = Date.now();

      const response = await fetch(url);
      if (!response.ok) {
        throw new Error(`Codeforces returned HTTP ${response.status}`);
      }

      const json = await response.json();
      if (json.status !== 'OK') {
        throw new Error(json.comment || 'Codeforces API request failed');
      }
      return json;
    }

    function CyberBackground() {
      const canvasRef = useRef(null);
      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let animId;
        let w = (canvas.width = window.innerWidth);
        let h = (canvas.height = window.innerHeight);

        const handleResize = () => {
          w = canvas.width = window.innerWidth;
          h = canvas.height = window.innerHeight;
        };
        window.addEventListener('resize', handleResize);

        const particles = Array.from({ length: 50 }, () => ({
          x: Math.random() * w,
          y: Math.random() * h,
          vx: (Math.random() - 0.5) * 0.4,
          vy: (Math.random() - 0.5) * 0.4,
          r: Math.random() * 1.5 + 0.8,
          color: Math.random() > 0.6 ? '#00f2fe' : Math.random() > 0.3 ? '#8b5cf6' : '#ffa116'
        }));

        let mouse = { x: -1000, y: -1000 };
        const onMouseMove = (e) => { mouse.x = e.clientX; mouse.y = e.clientY; };
        window.addEventListener('mousemove', onMouseMove);

        const loop = () => {
          ctx.clearRect(0, 0, w, h);

          // Deep radial vignette
          const grad = ctx.createRadialGradient(w / 2, h / 2, 50, w / 2, h / 2, Math.max(w, h) * 0.75);
          grad.addColorStop(0, '#060a12');
          grad.addColorStop(1, '#020306');
          ctx.fillStyle = grad;
          ctx.fillRect(0, 0, w, h);

          for (let i = 0; i < particles.length; i++) {
            const p = particles[i];
            p.x += p.vx;
            p.y += p.vy;
            if (p.x < 0 || p.x > w) p.vx *= -1;
            if (p.y < 0 || p.y > h) p.vy *= -1;

            const dx = mouse.x - p.x;
            const dy = mouse.y - p.y;
            const dist = Math.hypot(dx, dy);
            if (dist < 100) {
              p.x -= (dx / dist) * 1.2;
              p.y -= (dy / dist) * 1.2;
            }

            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
            ctx.fillStyle = p.color;
            ctx.shadowBlur = 10;
            ctx.shadowColor = p.color;
            ctx.fill();
            ctx.shadowBlur = 0;

            for (let j = i + 1; j < particles.length; j++) {
              const p2 = particles[j];
              const d = Math.hypot(p.x - p2.x, p.y - p2.y);
              if (d < 130) {
                ctx.strokeStyle = `rgba(0, 242, 254, ${(1 - d / 130) * 0.12})`;
                ctx.lineWidth = 0.6;
                ctx.beginPath();
                ctx.moveTo(p.x, p.y);
                ctx.lineTo(p2.x, p2.y);
                ctx.stroke();
              }
            }
          }
          animId = requestAnimationFrame(loop);
        };
        loop();

        return () => {
          window.removeEventListener('resize', handleResize);
          window.removeEventListener('mousemove', onMouseMove);
          cancelAnimationFrame(animId);
        };
      }, []);

      return <canvas ref={canvasRef} className="fixed inset-0 pointer-events-none z-0" />;
    }

    // ==========================================
    // MAIN APP CONTROLLER
    // ==========================================
    function App() {
      const [members, setMembers] = useState(() => {
        try {
          const s = localStorage.getItem(CACHE_KEY_MEMBERS);
          return s ? JSON.parse(s) : DEFAULT_MEMBERS;
        } catch {
          return DEFAULT_MEMBERS;
        }
      });

      const [clanData, setClanData] = useState([]);
      const [loading, setLoading] = useState(true);
      const [refreshing, setRefreshing] = useState(false);
      const [progressMsg, setProgressMsg] = useState('Booting Cyber Matrix...');
      const [activeTab, setActiveTab] = useState('hub'); // 'hub' | 'podium' | 'activity' | 'telemetry' | 'badges' | 'squad'
      const [selectedMember, setSelectedMember] = useState(null);
      const [lastUpdated, setLastUpdated] = useState(null);
      const [syncError, setSyncError] = useState('');

      // Squad form
      const [formName, setFormName] = useState('');
      const [formCf, setFormCf] = useState('');
      const [formLc, setFormLc] = useState('');
      const [formCc, setFormCc] = useState('');

      useEffect(() => {
        localStorage.setItem(CACHE_KEY_MEMBERS, JSON.stringify(members));
      }, [members]);

      useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      });

      // Data Engine
      const fetchTelemetry = async (force = false) => {
        if (!members.length) {
          setClanData([]);
          setLoading(false);
          return;
        }

        try {
          setSyncError('');
          if (!force) {
            const cached = localStorage.getItem(CACHE_KEY_DATA);
            if (cached) {
              const { timestamp, data } = JSON.parse(cached);
              if (Date.now() - timestamp < CACHE_EXPIRY && data.length === members.length) {
                setClanData(data);
                setLastUpdated(timestamp);
                setLoading(false);
                return;
              }
            }
          }

          setRefreshing(true);
          setProgressMsg('Connecting to Codeforces, LeetCode & CodeChef Gateways...');

          // 1. Batch Codeforces Info
          const cfHandles = members.map(m => m.cf).filter(Boolean);
          let cfProfiles = {};
          if (cfHandles.length > 0) {
            try {
              const j = await fetchCodeforcesJson(`https://codeforces.com/api/user.info?handles=${encodeURIComponent(cfHandles.join(';'))}`);
              j.result.forEach(u => { cfProfiles[u.handle.toLowerCase()] = u; });
            } catch (err) {
              console.warn('CF Batch Fetch Warning:', err);
            }
          }

          const aggregated = [];
          // Calendar periods use the browser's local timezone.
          const today = new Date();
          const todayStart = new Date(today.getFullYear(), today.getMonth(), today.getDate());
          const weekStart = new Date(todayStart);
          weekStart.setDate(weekStart.getDate() - 6);
          const monthStart = new Date(todayStart);
          monthStart.setDate(monthStart.getDate() - 29);
          const todayStartTs = Math.floor(todayStart.getTime() / 1000);
          const weekStartTs = Math.floor(weekStart.getTime() / 1000);
          const monthStartTs = Math.floor(monthStart.getTime() / 1000);

          // 2. Process each member's multi-platform profile
          for (let i = 0; i < members.length; i++) {
            const mem = members[i];
            setProgressMsg(`Synchronizing telemetry for ${mem.name} (${i + 1}/${members.length})...`);

            // --- CF Submissions & Rating History ---
            let cfSubmissions = [];
            let cfRatingHistory = [];
            if (mem.cf) {
              // Fetch public submissions in pages instead of silently stopping at 800.
              let from = 1;
              const pageSize = 10000;
              while (true) {
                const subJ = await fetchCodeforcesJson(`https://codeforces.com/api/user.status?handle=${encodeURIComponent(mem.cf)}&from=${from}&count=${pageSize}`);
                cfSubmissions.push(...subJ.result);

                if (subJ.result.length < pageSize) break;
                from += subJ.result.length;
              }

              const ratJ = await fetchCodeforcesJson(`https://codeforces.com/api/user.rating?handle=${encodeURIComponent(mem.cf)}`);
              cfRatingHistory = ratJ.result;
            }

            // Parse Codeforces AC Problems & Heatmap
            const uniqueProblemsMap = new Map();
            const dailyCounts = {};
            const difficultyMap = {};

            const acceptedCF = cfSubmissions.filter(s => s.verdict === 'OK');
            acceptedCF.sort((a, b) => a.creationTimeSeconds - b.creationTimeSeconds);

            acceptedCF.forEach(sub => {
              if (!sub.problem || !sub.problem.contestId) return;
              const key = `${sub.problem.contestId}-${sub.problem.index}`;
              if (!uniqueProblemsMap.has(key)) {
                uniqueProblemsMap.set(key, sub);

                const dStr = localDateKey(new Date(sub.creationTimeSeconds * 1000));
                dailyCounts[dStr] = (dailyCounts[dStr] || 0) + 1;

                if (sub.problem.rating) {
                  const bucket = Math.floor(sub.problem.rating / 100) * 100;
                  difficultyMap[bucket] = (difficultyMap[bucket] || 0) + 1;
                }
              }
            });

            let solvedToday = 0;
            let solved7d = 0;
            let solved30d = 0;

            uniqueProblemsMap.forEach(sub => {
              const ts = sub.creationTimeSeconds;
              if (ts >= todayStartTs) solvedToday++;
              if (ts >= weekStartTs) solved7d++;
              if (ts >= monthStartTs) solved30d++;
            });

            // Calculate the longest streak across all available submission history.
            const activeDays = Object.keys(dailyCounts)
              .filter(key => dailyCounts[key] > 0)
              .sort();

            let currentStreak = 0;
            let maxStreak = 0;
            let counter = 0;

            for (let d = 0; d < activeDays.length; d++) {
              if (
                d === 0 ||
                dateKeyOrdinal(activeDays[d]) - dateKeyOrdinal(activeDays[d - 1]) === 1
              ) {
                counter++;
              } else {
                counter = 1;
              }
              maxStreak = Math.max(maxStreak, counter);
            }

            // A streak remains active if the user solved today or yesterday.
            const todayKey = localDateKey(new Date());
            const yesterday = new Date();
            yesterday.setDate(yesterday.getDate() - 1);
            const yesterdayKey = localDateKey(yesterday);
            const streakAnchor = dailyCounts[todayKey] ? todayKey : yesterdayKey;

            if (dailyCounts[streakAnchor]) {
              currentStreak = 1;
              const cursor = new Date(`${streakAnchor}T12:00:00`);

              while (true) {
                cursor.setDate(cursor.getDate() - 1);
                if (!dailyCounts[localDateKey(cursor)]) break;
                currentStreak++;
              }
            }

            // Rating Delta
            let ratingChange = 0;
            if (cfRatingHistory.length > 0) {
              const last = cfRatingHistory[cfRatingHistory.length - 1];
              ratingChange = last.newRating - last.oldRating;
            }

            // --- LeetCode Sync ---
            let lcStats = { total: 0, easy: 0, medium: 0, hard: 0, rank: 'N/A' };
            if (mem.lc) {
              try {
                const lcR = await fetch(`https://leetcode-stats-api.herokuapp.com/${encodeURIComponent(mem.lc)}`);
                const lcJ = await lcR.json();
                if (lcJ.status === 'success') {
                  lcStats = {
                    total: lcJ.totalSolved || 0,
                    easy: lcJ.easySolved || 0,
                    medium: lcJ.mediumSolved || 0,
                    hard: lcJ.hardSolved || 0,
                    rank: lcJ.ranking || 'N/A'
                  };
                }
              } catch (e) {}
            }

            // --- CodeChef Sync ---
            let ccStats = { rating: 0, stars: 'Unrated', rank: 'N/A' };
            if (mem.cc) {
              try {
                const ccR = await fetch(`https://codechef-api.vercel.app/handle/${encodeURIComponent(mem.cc)}`);
                const ccJ = await ccR.json();
                if (ccJ && (ccJ.currentRating || ccJ.rating)) {
                  ccStats = {
                    rating: ccJ.currentRating || ccJ.rating || 0,
                    stars: ccJ.stars || '1★',
                    rank: ccJ.globalRank || 'N/A'
                  };
                }
              } catch (e) {}
            }

            const cfProfile = (mem.cf && cfProfiles[mem.cf.toLowerCase()]) || { handle: mem.cf || 'N/A', rating: 0 };
            const combinedScore = uniqueProblemsMap.size + lcStats.total;

            aggregated.push({
              member: mem,
              cfProfile,
              rankMeta: getRankMeta(cfProfile.rating),
              totalCFSolved: uniqueProblemsMap.size,
              solvedToday,
              solved7d,
              solved30d,
              ratingChange,
              currentStreak,
              maxStreak,
              dailyCounts,
              difficultyMap,
              recentAccepted: [...uniqueProblemsMap.values()].slice(-15).reverse(),
              ratingHistory: cfRatingHistory,
              lc: lcStats,
              cc: ccStats,
              combinedScore
            });
          }

          localStorage.setItem(CACHE_KEY_DATA, JSON.stringify({ timestamp: Date.now(), data: aggregated }));
          setClanData(aggregated);
          setLastUpdated(Date.now());
        } catch (err) {
          console.error(err);
          setSyncError(err.message || 'Unable to refresh data. Please try again.');
        } finally {
          setLoading(false);
          setRefreshing(false);
        }
      };

      useEffect(() => {
        fetchTelemetry();
      }, [members]);

      // Clan Metrics & MVPs
      const metrics = useMemo(() => {
        if (!clanData.length) return null;
        const totalCF = clanData.reduce((acc, m) => acc + m.totalCFSolved, 0);
        const totalLC = clanData.reduce((acc, m) => acc + m.lc.total, 0);
        const totalAll = totalCF + totalLC;
        const todayAC = clanData.reduce((acc, m) => acc + m.solvedToday, 0);
        const sevenDaysAC = clanData.reduce((acc, m) => acc + m.solved7d, 0);

        const ratedCF = clanData.filter(m => m.cfProfile.rating);
        const avgCFRating = ratedCF.length > 0 ? Math.round(ratedCF.reduce((a, b) => a + b.cfProfile.rating, 0) / ratedCF.length) : 0;

        // Honors
        const dailyVanguard = [...clanData].sort((a, b) => b.solvedToday - a.solvedToday)[0];
        const weeklyGrinder = [...clanData].sort((a, b) => b.solved7d - a.solved7d)[0];
        const apexPredator = [...clanData].sort((a, b) => (b.cfProfile.rating || 0) - (a.cfProfile.rating || 0))[0];
        const streakTitan = [...clanData].sort((a, b) => b.currentStreak - a.currentStreak)[0];

        return {
          totalCF, totalLC, totalAll, todayAC, sevenDaysAC, avgCFRating,
          dailyVanguard: (dailyVanguard && dailyVanguard.solvedToday > 0) ? dailyVanguard : null,
          weeklyGrinder: (weeklyGrinder && weeklyGrinder.solved7d > 0) ? weeklyGrinder : null,
          apexPredator,
          streakTitan: (streakTitan && streakTitan.currentStreak > 0) ? streakTitan : null
        };
      }, [clanData]);

      // Handlers
      const handleAddMember = async (e) => {
        e.preventDefault();
        const cfHandle = formCf.trim();

        if (!formName.trim() || !cfHandle) return;

        if (members.some(m => (m.cf || '').toLowerCase() === cfHandle.toLowerCase())) {
          alert('This Codeforces handle is already in the squad.');
          return;
        }

        // Verify the Codeforces handle before saving it to the squad.
        try {
          await fetchCodeforcesJson(`https://codeforces.com/api/user.info?handles=${encodeURIComponent(cfHandle)}`);
        } catch (err) {
          alert(`Could not verify Codeforces handle: ${err.message}`);
          return;
        }

        const updated = [...members, {
          name: formName.trim(),
          cf: cfHandle,
          lc: formLc.trim() || cfHandle,
          cc: formCc.trim() || cfHandle
        }];

        setMembers(updated);
        setFormName('');
        setFormCf('');
        setFormLc('');
        setFormCc('');
        localStorage.removeItem(CACHE_KEY_DATA);
        // The members effect will start a refresh using the updated state.
      };

      const handleRemoveMember = (idx) => {
        if (members.length <= 1) return alert('Keep at least one clan member.');
        if (confirm('De-authorize member from radar?')) {
          const updated = members.filter((_, i) => i !== idx);
          setMembers(updated);
          localStorage.removeItem(CACHE_KEY_DATA);
          // The members effect will refresh using the updated state.
        }
      };

      return (
        <div className="relative min-h-screen text-slate-200 grid-lines">
          <CyberBackground />

          <div className="relative z-10 flex flex-col min-h-screen">
            
            {/* FUTURISTIC HUD NAVIGATION */}
            <header className="sticky top-0 z-40 border-b border-white/[0.08] bg-[#030508]/80 backdrop-blur-2xl">
              <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
                
                {/* Brand Logo */}
                <div className="flex items-center space-x-3 cursor-pointer" onClick={() => setActiveTab('hub')}>
                  <div className="relative flex items-center justify-center w-10 h-10 rounded-xl bg-gradient-to-br from-cyan-400 via-indigo-500 to-amber-500 p-[1px] shadow-glow-cyan animate-float">
                    <div className="w-full h-full bg-[#050811] rounded-xl flex items-center justify-center font-mono font-black text-cyan-300 text-sm">
                      &lt;/&gt;
                    </div>
                  </div>
                  <div>
                    <div className="flex items-center space-x-2">

    // ==========================================
    // COMPONENT: ACTIVITY & 180-DAY HEATMAP
    // ==========================================
    function ActivityTab({ clanData, onSelectMember }) {
      const [inspectHandle, setInspectHandle] = useState(clanData[0]?.member.name || '');

      const target = useMemo(() => {
        return clanData.find(d => d.member.name === inspectHandle) || clanData[0];
      }, [clanData, inspectHandle]);

      const past180Days = useMemo(() => {
        const days = [];
        const today = new Date();
        for (let i = 179; i >= 0; i--) {
          const d = new Date(today.getFullYear(), today.getMonth(), today.getDate());
          d.setDate(d.getDate() - i);
          days.push(localDateKey(d));
        }
        return days;
      }, []);

      const last7Headers = useMemo(() => {
        const arr = [];
        const today = new Date();
        for (let i = 6; i >= 0; i--) {
          const d = new Date(today.getFullYear(), today.getMonth(), today.getDate());
          d.setDate(d.getDate() - i);
          arr.push({
            dateKey: localDateKey(d),
            label: i === 0 ? 'Today' : i === 1 ? 'Yest' : d.toLocaleDateString('en-US', { weekday: 'short' })
          });
        }
        return arr;
      }, []);

      return (
        <div className="space-y-8 animate-fadeIn">
          <div>
            <h2 className="text-2xl font-black text-white font-sans flex items-center gap-2">
              <i data-lucide="calendar" className="w-6 h-6 text-cyan-400"></i>
              <span>Grind Matrix & Consistency Telemetry</span>
            </h2>
            <p className="text-xs font-mono text-slate-400 mt-1">Daily problem-solving frequency mapped to temporal grids.</p>
          </div>

          {/* 7-DAY COMPARISON TABLE */}
          <div className="cyber-panel rounded-2xl p-6">
            <h3 className="text-xs font-bold uppercase tracking-wider text-cyan-300 font-mono mb-4 flex items-center gap-2">
              <i data-lucide="grid" className="w-4 h-4"></i>
              <span>7-Day Tactical Velocity</span>
            </h3>

            <div className="overflow-x-auto">
              <table className="w-full text-left font-mono text-xs">
                <thead>
                  <tr className="border-b border-white/[0.08] text-slate-500 text-[10px]">
                    <th className="py-3 px-4">Pilot</th>
                    {last7Headers.map(h => (
                      <th key={h.dateKey} className="py-3 px-3 text-center">{h.label}</th>
                    ))}
                    <th className="py-3 px-4 text-right">7D Sum</th>
                    <th className="py-3 px-4 text-right">Streak</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-white/[0.04]">
                  {clanData.map(d => (
                    <tr key={d.member.name} className="hover:bg-white/[0.02]">
                      <td className="py-3 px-4 font-bold text-white cursor-pointer hover:text-cyan-300" onClick={() => onSelectMember(d)}>
                        {d.member.name}
                      </td>
                      {last7Headers.map(h => {
                        const c = d.dailyCounts[h.dateKey] || 0;
                        return (
                          <td key={h.dateKey} className="py-3 px-3 text-center">
                            <span className={`inline-block w-8 py-1 rounded text-[11px] font-bold ${
                              c > 4 ? 'bg-cyan-400 text-black shadow-glow-cyan' :
                              c > 1 ? 'bg-cyan-500/30 text-cyan-300 border border-cyan-400/30' :
                              c === 1 ? 'bg-cyan-950/60 text-cyan-400 border border-cyan-800/40' :
                              'text-slate-600 bg-white/[0.01]'
                            }`}>
                              {c}
                            </span>
                          </td>
                        );
                      })}
                      <td className="py-3 px-4 text-right font-bold text-purple-400">+{d.solved7d}</td>
                      <td className="py-3 px-4 text-right font-bold text-amber-400">
                        {d.currentStreak > 0 ? `${d.currentStreak}d 🔥` : '-'}
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>

          {/* 180-DAY MATRIX HEATMAP */}
          <div className="cyber-panel rounded-2xl p-6">
            <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">
              <div>
                <h3 className="text-xs font-bold uppercase tracking-wider text-cyan-300 font-mono flex items-center gap-2">
                  <i data-lucide="flame" className="w-4 h-4 text-cyan-400"></i>
                  <span>180-Day Density Matrix</span>
                </h3>
                <p className="text-xs text-slate-400 font-mono mt-0.5">Continuous visual tracking for individual grind patterns.</p>
              </div>

              <div className="flex items-center space-x-2">
                <span className="text-xs font-mono text-slate-500">Pilot:</span>
                <select
                  value={target?.member.name || ''}
                  onChange={e => setInspectHandle(e.target.value)}
                  className="bg-[#050811] border border-white/[0.08] rounded-xl px-3 py-1.5 text-xs font-mono text-cyan-300 focus:outline-none focus:border-cyan-400"
                >
                  {clanData.map(d => (
                    <option key={d.member.name} value={d.member.name}>{d.member.name}</option>
                  ))}
                </select>
              </div>
            </div>

            {target && (
              <div>
                <div className="overflow-x-auto pb-4">
                  <div className="flex gap-1.5 min-w-[700px]">
                    {Array.from({ length: Math.ceil(past180Days.length / 7) }).map((_, colIdx) => (
                      <div key={colIdx} className="flex flex-col gap-1.5">
                        {Array.from({ length: 7 }).map((_, rowIdx) => {
                          const idx = colIdx * 7 + rowIdx;
                          if (idx >= past180Days.length) return null;
                          const dateKey = past180Days[idx];
                          const cnt = target.dailyCounts[dateKey] || 0;

                          let bg = 'bg-white/[0.03] border border-white/[0.03]';
                          if (cnt >= 6) bg = 'bg-cyan-400 shadow-glow-cyan border-cyan-300';
                          else if (cnt >= 3) bg = 'bg-cyan-500/70 border-cyan-400/40';
                          else if (cnt >= 1) bg = 'bg-cyan-950/70 border-cyan-700/50';

                          return (
                            <div
                              key={dateKey}
                              title={`${dateKey}: ${cnt} solved`}
                              className={`w-3.5 h-3.5 rounded-sm transition-transform hover:scale-125 cursor-pointer ${bg}`}
                            />
                          );
                        })}
                      </div>
                    ))}
                  </div>
                </div>

                <div className="flex items-center justify-between text-xs font-mono text-slate-400 pt-4 border-t border-white/[0.06]">
                  <div>
                    Streak: <strong className="text-amber-400">{target.currentStreak} Days Active</strong> (Peak: {target.maxStreak} Days)
                  </div>
                  <div className="flex items-center space-x-2">
                    <span className="text-[10px]">Zero</span>
                    <span className="w-3 h-3 rounded-sm bg-white/[0.03]"></span>
                    <span className="w-3 h-3 rounded-sm bg-cyan-950/70"></span>
                    <span className="w-3 h-3 rounded-sm bg-cyan-500/70"></span>
                    <span className="w-3 h-3 rounded-sm bg-cyan-400"></span>
                    <span className="text-[10px]">High</span>
                  </div>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    // ==========================================
    // COMPONENT: TELEMETRY SVG CURVES
    // ==========================================
    function TelemetryCurvesTab({ clanData }) {
      const [selectedPilots, setSelectedPilots] = useState(
        clanData.slice(0, 4).map(d => d.member.name)
      );

      const togglePilot = (name) => {
        if (selectedPilots.includes(name)) {
          if (selectedPilots.length === 1) return;
          setSelectedPilots(selectedPilots.filter(n => n !== name));
        } else {
          setSelectedPilots([...selectedPilots, name]);
        }
      };

      const lineColors = ['#00f2fe', '#8b5cf6', '#ffa116', '#10b981', '#f43f5e'];

      const curveData = useMemo(() => {
        const filtered = clanData.filter(d => selectedPilots.includes(d.member.name));
        let allTs = [];
        filtered.forEach(d => {
          d.ratingHistory.forEach(c => allTs.push(c.ratingUpdateTimeSeconds));
        });
        allTs = [...new Set(allTs)].sort((a, b) => a - b);

        if (!allTs.length) return { minR: 1000, maxR: 2600, series: [], allTs: [] };

        let minR = 9999;
        let maxR = 0;

        const series = filtered.map((d, i) => {
          const pts = [];
          d.ratingHistory.forEach(c => {
            minR = Math.min(minR, c.newRating);
            maxR = Math.max(maxR, c.newRating);
            pts.push({ ts: c.ratingUpdateTimeSeconds, r: c.newRating, contest: c.contestName });
          });
          return { name: d.member.name, color: lineColors[i % lineColors.length], pts };
        });

        minR = Math.max(0, Math.floor((minR - 100) / 100) * 100);
        maxR = Math.ceil((maxR + 100) / 100) * 100;

        return { minR, maxR, series, allTs };
      }, [clanData, selectedPilots]);

      return (
        <div className="space-y-8 animate-fadeIn">
          <div>
            <h2 className="text-2xl font-black text-white font-sans flex items-center gap-2">
              <i data-lucide="line-chart" className="w-6 h-6 text-purple-400"></i>
              <span>Interactive Telemetry Curves</span>
            </h2>
            <p className="text-xs font-mono text-slate-400 mt-1">Dynamic rating progression from verified rated contests.</p>
          </div>

          <div className="cyber-panel rounded-2xl p-6">
            <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">
              <h3 className="text-xs font-bold uppercase tracking-wider text-cyan-300 font-mono">
                Codeforces Rating Trajectory
              </h3>

              <div className="flex items-center gap-2 flex-wrap">
                {clanData.map(d => {
                  const active = selectedPilots.includes(d.member.name);
                  return (
                    <button
                      key={d.member.name}
                      onClick={() => togglePilot(d.member.name)}
                      className={`px-2.5 py-1 rounded-lg text-xs font-mono transition-all border ${
                        active
                          ? 'bg-cyan-500/20 text-cyan-300 border-cyan-500/40 shadow-glow-cyan'
                          : 'bg-white/[0.02] text-slate-500 border-white/[0.05]'
                      }`}
                    >
                      {d.member.name}
                    </button>
                  );
                })}
              </div>
            </div>

            {/* SVG Canvas */}
            <div className="w-full h-72 sm:h-80 relative select-none">
              {curveData.series.length > 0 && curveData.allTs.length > 0 ? (() => {
                const w = 800; const h = 280;
                const pad = { top: 20, right: 30, bottom: 30, left: 50 };
                const graphW = w - pad.left - pad.right;
                const graphH = h - pad.top - pad.bottom;

                const minTs = curveData.allTs[0];
                const maxTs = curveData.allTs[curveData.allTs.length - 1];
                const tsSpan = Math.max(1, maxTs - minTs);
                const rSpan = Math.max(1, curveData.maxR - curveData.minR);

                const getX = (ts) => pad.left + ((ts - minTs) / tsSpan) * graphW;
                const getY = (r) => pad.top + (1 - (r - curveData.minR) / rSpan) * graphH;

                return (
                  <svg viewBox={`0 0 ${w} ${h}`} className="w-full h-full overflow-visible">
                    {[0, 0.33, 0.66, 1].map((pct, idx) => {
                      const y = pad.top + pct * graphH;
                      const val = Math.round(curveData.maxR - pct * rSpan);
                      return (
                        <g key={idx}>
                          <line x1={pad.left} y1={y} x2={w - pad.right} y2={y} stroke="rgba(255,255,255,0.06)" strokeDasharray="3 3" />
                          <text x={pad.left - 8} y={y + 3} textAnchor="end" fill="#64748b" fontSize="10" fontFamily="JetBrains Mono">{val}</text>
                        </g>
                      );
                    })}

                    {curveData.series.map(s => {
                      if (!s.pts.length) return null;
                      const dStr = s.pts.map((pt, i) => `${i === 0 ? 'M' : 'L'} ${getX(pt.ts)} ${getY(pt.r)}`).join(' ');
                      return (
                        <g key={s.name}>
                          <path d={dStr} fill="none" stroke={s.color} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" />
                          {s.pts.map((pt, pIdx) => (
                            <circle key={pIdx} cx={getX(pt.ts)} cy={getY(pt.r)} r="3" fill={s.color}>
                              <title>{`${s.name}: ${pt.r} (${pt.contest})`}</title>
                            </circle>
                          ))}
                        </g>
                      );
                    })}
                  </svg>
                );
              })() : (
                <div className="h-full flex items-center justify-center text-xs font-mono text-slate-600">
                  Insufficient contest history recorded.
                </div>
              )}
            </div>

            {/* Legend */}
            <div className="flex items-center justify-center gap-6 mt-4 pt-4 border-t border-white/[0.06] flex-wrap">
              {curveData.series.map(s => (
                <div key={s.name} className="flex items-center space-x-2 text-xs font-mono">
                  <span className="w-2.5 h-2.5 rounded-full" style={{ backgroundColor: s.color }}></span>
                  <span className="text-white font-bold">{s.name}</span>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // COMPONENT: BADGES & ARENA
    // ==========================================

                    </div>
                  </div>
                  <p className="text-xs text-slate-400 mt-2">{b.desc}</p>
                </div>

                <div className="mt-4 pt-3 border-t border-white/[0.06] flex items-center gap-1.5 flex-wrap">
                  {b.unlocked.length > 0 ? (
                    b.unlocked.map(d => (

                        key={d.member.name}
                        onClick={() => onSelectMember(d)}
                        className="px-2 py-0.5 rounded text-[10px] font-mono bg-white/[0.05] hover:bg-white/[0.1] text-cyan-300 cursor-pointer border border-white/[0.08]"
                      >

                    ))
                  ) : (
                    <span className="text-[10px] font-mono text-slate-600">Locked by everyone</span>
                  )}
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // ==========================================
    // COMPONENT: PROFILE DOSSIER MODAL
    // ==========================================
    function ProfileDossierModal({ member, onClose }) {
      if (!member) return null;
      const { member: m, cfProfile, rankMeta, totalCFSolved, solvedToday, solved7d, currentStreak, maxStreak, lc, cc, recentAccepted, ratingHistory } = member;

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-md animate-fadeIn" onClick={onClose}>
          <div
            className="cyber-panel relative w-full max-w-3xl max-h-[90vh] rounded-3xl overflow-hidden flex flex-col border-cyan-500/30 shadow-glow-cyan"
            onClick={e => e.stopPropagation()}
          >
            {/* Header */}
            <div className="p-6 bg-gradient-to-r from-cyan-950/40 via-purple-950/40 to-amber-950/40 border-b border-white/[0.08] flex items-center justify-between">
              <div>
                <h3 className="text-2xl font-black text-white">{m.name}</h3>
                <p className="text-xs font-mono text-slate-400">
                  CF: <span className="text-cyan-400">@{m.cf}</span> &bull; LC: <span className="text-amber-400">@{m.lc}</span> &bull; CC: <span className="text-amber-600">@{m.cc}</span>
                </p>
              </div>
              <button onClick={onClose} className="p-2 rounded-xl bg-white/[0.05] text-slate-400 hover:text-white">
                <i data-lucide="x" className="w-5 h-5"></i>
              </button>
            </div>

            {/* Scrollable Body */}
            <div className="p-6 overflow-y-auto space-y-6">
              
              {/* Tri-Platform 3 Cards */}
              <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 font-mono text-xs">
                {/* CF */}
                <div className="p-4 rounded-xl bg-white/[0.02] border border-cyan-500/20">
                  <span className="text-[10px] text-cyan-400 uppercase font-bold block mb-1">Codeforces</span>
                  <span className="text-xl font-bold text-white">{cfProfile.rating || 0}</span>
                  <span className="block text-[10px] font-bold" style={{ color: rankMeta.color }}>{rankMeta.name}</span>
                  <span className="block text-slate-500 mt-2">Solved: {totalCFSolved}</span>
                </div>
                {/* LC */}
                <div className="p-4 rounded-xl bg-white/[0.02] border border-amber-500/20">
                  <span className="text-[10px] text-amber-400 uppercase font-bold block mb-1">LeetCode</span>
                  <span className="text-xl font-bold text-white">{lc.total} AC</span>
                  <span className="block text-[10px] text-slate-400">Rank: #{lc.rank}</span>
                  <span className="block text-slate-500 mt-2">E:{lc.easy} M:{lc.medium} H:{lc.hard}</span>
                </div>
                {/* CC */}
                <div className="p-4 rounded-xl bg-white/[0.02] border border-amber-800/20">
                  <span className="text-[10px] text-amber-600 uppercase font-bold block mb-1">CodeChef</span>
                  <span className="text-xl font-bold text-white">{cc.stars}</span>
                  <span className="block text-[10px] text-slate-400">Rating: {cc.rating}</span>
                  <span className="block text-slate-500 mt-2">Global: #{cc.rank}</span>
                </div>
              </div>

              {/* Solved Velocity */}
              <div className="grid grid-cols-3 gap-3 font-mono text-xs text-center">
                <div className="p-3 rounded-xl bg-white/[0.02] border border-white/[0.05]">
                  <span className="text-slate-500 text-[10px] block">TODAY</span>
                  <span className="text-lg font-bold text-cyan-400">+{solvedToday}</span>
                </div>
                <div className="p-3 rounded-xl bg-white/[0.02] border border-white/[0.05]">
                  <span className="text-slate-500 text-[10px] block">7-DAY</span>
                  <span className="text-lg font-bold text-purple-400">+{solved7d}</span>
                </div>
                <div className="p-3 rounded-xl bg-white/[0.02] border border-white/[0.05]">
                  <span className="text-slate-500 text-[10px] block">ACTIVE STREAK</span>
                  <span className="text-lg font-bold text-amber-400">{currentStreak}d 🔥</span>
                </div>
              </div>

              {/* Recent Accepted Problems */}
              <div>
                <h4 className="text-xs font-mono font-bold uppercase tracking-wider text-cyan-300 mb-2">
                  Recent Codeforces Accepted
                </h4>
                <div className="space-y-1.5 max-h-44 overflow-y-auto pr-1">
                  {recentAccepted.slice(0, 8).map((sub, idx) => (
                    <div key={idx} className="p-2.5 rounded-lg bg-white/[0.02] border border-white/[0.04] flex items-center justify-between text-xs font-mono">
                      <a
                        href={`https://codeforces.com/contest/${sub.problem.contestId}/problem/${sub.problem.index}`}
                        target="_blank"
                        rel="noreferrer"
                        className="text-white hover:text-cyan-300 font-sans truncate max-w-[280px]"
                      >
                        {sub.problem.contestId}{sub.problem.index} - {sub.problem.name}
                      </a>
                      {sub.problem.rating && (
                        <span className="text-[10px] px-1.5 py-0.5 rounded bg-cyan-950/40 text-cyan-400 border border-cyan-800/40">
                          ★ {sub.problem.rating}
                        </span>
                      )}
                    </div>
                  ))}
                </div>
              </div>

              {/* Contest Swings */}
              {ratingHistory.length > 0 && (
                <div>
                  <h4 className="text-xs font-mono font-bold uppercase tracking-wider text-purple-300 mb-2">
                    Recent Contest Swings
                  </h4>
                  <div className="space-y-1.5 max-h-36 overflow-y-auto pr-1">
                    {[...ratingHistory].reverse().slice(0, 4).map(c => {
                      const delta = c.newRating - c.oldRating;
                      return (
                        <div key={c.contestId} className="p-2.5 rounded-lg bg-white/[0.02] border border-white/[0.04] flex items-center justify-between text-xs font-mono">
                          <span className="truncate max-w-[280px] font-sans text-white">{c.contestName}</span>
                          <span className={`font-bold ${delta >= 0 ? 'text-emerald-400' : 'text-rose-400'}`}>
                            {delta >= 0 ? `+${delta}` : delta} ({c.newRating})
                          </span>
                        </div>
                      );
                    })}
                  </div>
                </div>
              )}

            </div>

            <div className="p-4 bg-[#04060c] border-t border-white/[0.06] flex justify-end">
              <button onClick={onClose} className="px-4 py-1.5 rounded-xl bg-white/[0.05] text-xs font-mono text-white">
                CLOSE
              </button>
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
